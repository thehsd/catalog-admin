# ═══════════════════════════════════════════════════════════════════════════════════════
# catalog-admin — production Nginx server block
# ═══════════════════════════════════════════════════════════════════════════════════════
# This container does two things: it serves the built React SPA, and it is the SPA's API
# origin.
#
# The second job is the interesting one. A browser cannot resolve `catalog-api` — Docker's
# embedded DNS answers containers, not the host's browser — so the SPA is built with
# `VITE_API_BASE_URL=/api` and asks *this* server for its data. Nginx, which is on the
# Docker network, forwards to `http://catalog-api:4000`.
#
#     Browser → http://localhost:5173/api/admin/products      (same origin as the SPA)
#             → catalog-admin Nginx
#             → http://catalog-api:4000/api/admin/products     (Docker network)
#
# Two consequences worth stating: the browser never needs a Docker DNS name, and the
# request is same-origin, so no CORS preflight happens in the Docker deployment at all.
# Express keeps its `ADMIN_ORIGIN` allow-list anyway, for direct `pnpm dev` use.
# ═══════════════════════════════════════════════════════════════════════════════════════

# ── runtime DNS resolution ───────────────────────────────────────────────────────────────
# 127.0.0.11 is Docker's embedded DNS server, present in every container on a user-defined
# network. Naming it here is what makes the `$catalog_api` variable below resolvable.
#
# This is not decoration. Nginx resolves a *literal* hostname in `proxy_pass` once, at
# startup, and caches the address for the process's lifetime — so after `docker compose up`
# recreated catalog-api with a different IP, this container would proxy to an address that
# no longer exists until someone restarted it. A variable in `proxy_pass` forces resolution
# per request instead, honouring `valid=10s`.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    # Port 80 inside the container; Compose publishes it on the host as 5173 so the URL a
    # developer types is the same with or without Docker.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx announcing its version on every response is free reconnaissance.
    server_tokens off;

    # The admin is a same-origin SPA; nothing here is designed to be framed or sniffed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Small JSON in, small JSON out. 64k matches Express's own body limit.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── health ───────────────────────────────────────────────────────────────────────────
    # Answered by Nginx itself. It deliberately does NOT proxy to Express: this probe
    # reports whether the admin container can serve its own UI, and a health check that
    # failed because a *different* service was down would make Compose restart the wrong
    # container. It also stays out of the access log, since Compose calls it every 5s.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API reverse proxy ────────────────────────────────────────────────────────────────
    # Everything the SPA fetches — GET /api/admin/products, PATCH /api/admin/variants/:id,
    # GET /api/debug/stats, POST /api/debug/retry-webhook/:id — lands here.
    location /api/ {
        # A variable, so the name is resolved per request through the resolver above.
        set $catalog_api_upstream http://catalog-api:4000;

        # With a variable in proxy_pass, Nginx does NOT append the matched location URI,
        # so the URI is passed explicitly. `$request_uri` is the untouched original path
        # *and query string*, which keeps `/api/x?filter=size-12` intact and keeps the
        # path prefix identical on both sides — Express sees exactly `/api/...`, so its
        # request classifier buckets the traffic the same way it does without Docker.
        proxy_pass $catalog_api_upstream$request_uri;

        # HTTP/1.1 with an explicit empty Connection header: the default (HTTP/1.0, no
        # keepalive) works but reconnects per request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Method and body are forwarded unchanged. PATCH and its JSON body reach Express
        # exactly as the browser sent them, and `proxy_request_buffering on` (the default)
        # means Express sees a complete request with a real Content-Length.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Content-Type must survive, or Express's `express.json()` will not parse the body.
        proxy_pass_request_headers on;
        proxy_pass_request_body on;

        # A local JSON API either answers in milliseconds or is broken. These timeouts are
        # generous enough for a cold Node process and short enough that a stopped
        # catalog-api surfaces as a fast 502 in the admin UI rather than a hung spinner.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Never serve a cached API response. TanStack Query owns freshness on the client,
        # and the admin's whole purpose is to show what Express holds *right now* — a
        # proxy-level cache here would be a third cache nobody asked for.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ── hashed build assets ──────────────────────────────────────────────────────────────
    # Vite fingerprints everything under /assets/ (`index-B1cD2e3F.js`). The name changes
    # whenever the bytes change, so the bytes behind a given name never change and can be
    # cached permanently.
    # `expires 1y;` is deliberately NOT used here. It emits its own `Cache-Control:
    # max-age=…` in addition to the one below, and a response carrying two Cache-Control
    # headers is a response whose caching behaviour depends on which one a given proxy
    # reads first. One explicit header, including `immutable`, is unambiguous — and
    # `max-age` overrides `Expires` for every HTTP/1.1 cache anyway.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Self-hosted fonts also carry a content hash.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── the entry document ───────────────────────────────────────────────────────────────
    # index.html must NEVER be cached like that. Its filename is fixed while its contents
    # change on every deploy, and it is the file that names the hashed assets — a stale
    # copy pins a browser to a build that no longer exists on the server.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────────────────
    # `createBrowserRouter` uses real URLs (/products/zob-ahan-rebar/variants, /debug), so a
    # reload or a pasted link asks Nginx for a path that exists only inside React Router.
    # Serving index.html lets the client-side router take over; without this every deep
    # link is a 404.
    #
    # This block is last on purpose — /api/ is matched by a longer prefix above, so an API
    # call can never fall through to the HTML document. (A `/api/*` request answered with
    # index.html is the classic version of this bug: the UI reports "invalid JSON" and the
    # cause is routing, not data.)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
